[package]
name = "dd-agent-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dd-domain = { path = "../../crates/dd-domain" }
dd-protocol = { path = "../../crates/dd-protocol" }
rig-agent = { version = "=0.47.1", default-features = false }
rig-core = { version = "=0.47.1", default-features = false }
rig-reqwest = { version = "=0.47.1", default-features = false, features = ["rustls"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = "=0.14.9"
uuid = { version = "=1.29.3", features = ["v4"] }

[[test]]
name = "agent_service"
path = "../../tests/integration/rpc/agent_service.rs"

[[test]]
name = "rig_model_client"
path = "../../tests/integration/rpc/rig_model_client.rs"
