[package]
name = "dd-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dd-core = { path = "../../../crates/dd-core" }
dd-infra = { path = "../../../crates/dd-infra", features = ["execution-rpc"] }
dd-ui-contracts = { path = "../../../crates/dd-ui-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = "=2.12.7"
tauri-plugin-dialog = "=2.8.4"
time = { version = "=0.3.55", features = ["formatting"] }
uuid = "=1.29.3"

[dev-dependencies]
dd-domain = { path = "../../../crates/dd-domain" }
rusqlite = { workspace = true }

[build-dependencies]
tauri-build = "=2.7.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
video-acceptance = []
