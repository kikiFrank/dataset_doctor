[package]
name = "dd-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rusqlite.workspace = true
jsonschema = { version = "=0.63.1", default-features = false, features = ["arbitrary-precision"] }
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[[test]]
name = "workspace_migration"
path = "../../tests/storage/sqlite/migration/workspace_migration.rs"

[[test]]
name = "app_migration"
path = "../../tests/storage/sqlite/migration/app_migration.rs"

[[test]]
name = "json_contracts"
path = "../../tests/contracts/rust/json_contracts.rs"
