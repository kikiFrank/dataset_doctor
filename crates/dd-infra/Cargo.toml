[package]
name = "dd-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dd-core = { path = "../dd-core" }
rusqlite.workspace = true
jsonschema = { version = "=0.63.1", default-features = false, features = ["arbitrary-precision"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
uuid = "=1.29.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[[test]]
name = "workspace_migration"
path = "../../tests/storage/sqlite/migration/workspace_migration.rs"

[[test]]
name = "app_migration"
path = "../../tests/storage/sqlite/migration/app_migration.rs"

[[test]]
name = "json_contracts"
path = "../../tests/contracts/rust/json_contracts.rs"

[[test]]
name = "workspace_ownership"
path = "../../tests/storage/workspace/ownership.rs"

[[test]]
name = "workspace_open"
path = "../../tests/storage/workspace/open.rs"

[[test]]
name = "workspace_access"
path = "../../tests/storage/workspace/access.rs"

[[test]]
name = "workspace_thread"
path = "../../tests/storage/workspace/thread.rs"

[[test]]
name = "workspace_create"
path = "../../tests/storage/workspace/create.rs"

[[test]]
name = "import_preflight"
path = "../../tests/storage/import/preflight.rs"

[[test]]
name = "import_registration"
path = "../../tests/storage/import/registration.rs"
