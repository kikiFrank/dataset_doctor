[package]
name = "dd-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
execution-rpc = ["dep:dd-protocol", "dep:subtle", "dep:time", "dep:tokio", "dep:tonic"]

[dependencies]
dd-core = { path = "../dd-core" }
dd-protocol = { path = "../dd-protocol", optional = true }
rusqlite.workspace = true
jsonschema = { version = "=0.63.1", default-features = false, features = ["arbitrary-precision"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
subtle = { version = "=2.6.1", optional = true }
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting"], optional = true }
tokio = { version = "=1.54.1", features = ["rt"], optional = true }
tonic = { version = "=0.14.9", optional = true }
uuid = "=1.29.3"

[dev-dependencies]
prost = "=0.14.6"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[[test]]
name = "workspace_migration"
path = "../../tests/storage/sqlite/migration/workspace_migration.rs"

[[test]]
name = "app_migration"
path = "../../tests/storage/sqlite/migration/app_migration.rs"

[[test]]
name = "json_contracts"
path = "../../tests/contracts/rust/json_contracts.rs"

[[test]]
name = "workspace_ownership"
path = "../../tests/storage/workspace/ownership.rs"

[[test]]
name = "workspace_open"
path = "../../tests/storage/workspace/open.rs"

[[test]]
name = "workspace_access"
path = "../../tests/storage/workspace/access.rs"

[[test]]
name = "workspace_thread"
path = "../../tests/storage/workspace/thread.rs"

[[test]]
name = "workspace_create"
path = "../../tests/storage/workspace/create.rs"

[[test]]
name = "import_preflight"
path = "../../tests/storage/import/preflight.rs"

[[test]]
name = "import_registration"
path = "../../tests/storage/import/registration.rs"

[[test]]
name = "core_claim_loopback"
path = "../../tests/integration/rpc/core_claim_loopback.rs"
required-features = ["execution-rpc"]

[[test]]
name = "worker_geometry"
path = "../../tests/integration/rpc/worker_geometry.rs"
required-features = ["execution-rpc"]

[[test]]
name = "task_store"
path = "../../tests/storage/tasks/task_store.rs"
