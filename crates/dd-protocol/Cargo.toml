[package]
name = "dd-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
prost = "=0.14.6"
tonic = "=0.14.9"
tonic-prost = "=0.14.9"

[build-dependencies]
tonic-prost-build = "=0.14.9"

[dev-dependencies]
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "process", "time"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[[test]]
name = "worker_loopback"
path = "../../tests/integration/rpc/worker_loopback.rs"
