syntax = "proto3";

package datasetdoctor.v1;

import "datasetdoctor/v1/common.proto";

message TaskContext {
  string workspace_id = 1;
  string workspace_session_id = 2;
  string workflow_run_id = 3;
  string node_id = 4;
  string task_id = 5;
  string attempt_id = 6;
  string executor_session_id = 7;
  string input_fingerprint = 8;
  string node_spec_fingerprint = 9;
  string grant_id = 10;
}

message ClaimGrantRequest {
  string grant_id = 1;
  string workspace_session_id = 2;
  string task_id = 3;
  string attempt_id = 4;
  string executor_session_id = 5;
  string worker_execution_id = 6;
  string input_fingerprint = 7;
  string operation_digest = 8;
}

message ExecutionHandle {
  string task_id = 1;
  string attempt_id = 2;
  string worker_execution_id = 3;
}

message ExecutionStarted {}

message ExecutionSucceeded {
  ArtifactRef result_manifest_ref = 1;
}

enum ExecutionFailureCode {
  EXECUTION_FAILURE_CODE_UNSPECIFIED = 0;
  EXECUTION_FAILURE_CODE_INPUT_CHANGED = 1;
  EXECUTION_FAILURE_CODE_INVALID_INPUT = 2;
  EXECUTION_FAILURE_CODE_FILE_IO_FAILED = 3;
  EXECUTION_FAILURE_CODE_DECODE_FAILED = 4;
  EXECUTION_FAILURE_CODE_PIXEL_LIMIT_EXCEEDED = 5;
  EXECUTION_FAILURE_CODE_UNSUPPORTED_FORMAT = 6;
}

message ExecutionFailed {
  ExecutionFailureCode code = 1;
}

message ReportExecutionRequest {
  TaskContext context = 1;
  string execution_event_id = 2;
  string worker_execution_id = 3;
  string operation_digest = 4;
  uint64 source_event_seq = 5;
  oneof event {
    ExecutionStarted started = 6;
    ExecutionSucceeded succeeded = 7;
    ExecutionFailed failed = 8;
  }
}

message TerminalResultReceipt {
  string accepted_at = 1;
  string completion_fingerprint = 2;
  ArtifactRef result_manifest_ref = 3;
}

message ReportAck {
  bool accepted = 1;
  string execution_event_id = 2;
  TerminalResultReceipt terminal_receipt = 3;
}

service CoreExecutionControl {
  rpc ClaimGrant(ClaimGrantRequest) returns (ExecutionHandle);
  rpc ReportExecution(ReportExecutionRequest) returns (ReportAck);
}
