syntax = "proto3";

package datasetdoctor.v1;

message TaskContext {
  string workspace_id = 1;
  string workspace_session_id = 2;
  string workflow_run_id = 3;
  string node_id = 4;
  string task_id = 5;
  string attempt_id = 6;
  string executor_session_id = 7;
  string input_fingerprint = 8;
  string node_spec_fingerprint = 9;
  string grant_id = 10;
}

message ClaimGrantRequest {
  string grant_id = 1;
  string workspace_session_id = 2;
  string task_id = 3;
  string attempt_id = 4;
  string executor_session_id = 5;
  string worker_execution_id = 6;
  string input_fingerprint = 7;
  string operation_digest = 8;
}

message ExecutionHandle {
  string task_id = 1;
  string attempt_id = 2;
  string worker_execution_id = 3;
}

service CoreExecutionControl {
  rpc ClaimGrant(ClaimGrantRequest) returns (ExecutionHandle);
}
