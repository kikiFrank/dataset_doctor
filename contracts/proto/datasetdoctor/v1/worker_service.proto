syntax = "proto3";

package datasetdoctor.v1;

import "datasetdoctor/v1/common.proto";
import "datasetdoctor/v1/core_execution.proto";

message HealthRequest {}

message HealthSnapshot {
  string role = 1;
  string executor_session_id = 2;
  uint32 protocol_major = 3;
  string build_version = 4;
  repeated string loaded_capability_ids = 5;
  uint32 active_executions = 6;
}

message ShutdownRequest {}

message ShutdownReceipt {
  bool accepted = 1;
}

message WorkerInputFile {
  string path = 1;
  string sha256 = 2;
}

message GeometryAuditInput {
  WorkerInputFile image = 1;
  WorkerInputFile annotation = 2;
  WorkerInputFile input_manifest = 3;
  string output_directory = 4;
  uint64 max_pixels = 5;
}

message GeometryAuditRequest {
  TaskContext context = 1;
  ArtifactRef input_manifest_ref = 2;
  GeometryAuditInput parameters = 3;
}

message ColorPoint {
  double x = 1;
  double y = 2;
}

message ColorRectangle {
  ColorPoint origin = 1;
  double width = 2;
  double height = 3;
}

message ColorPolygon {
  repeated ColorPoint points = 1;
}

message ColorHueGate {
  double hue_min_deg = 1;
  double hue_max_deg = 2;
  bool wraps_zero = 3;
}

enum ColorMethod {
  COLOR_METHOD_UNSPECIFIED = 0;
  COLOR_METHOD_HUE_REMAP = 1;
  COLOR_METHOD_SOLID_FILL = 2;
}

message ColorOperation {
  ColorMethod method = 1;
  repeated uint32 target_rgb = 2;
  optional double strength = 3;
  double feather_px = 4;
  ColorHueGate source_color_gate = 5;
}

message ColorPreviewInput {
  WorkerInputFile image = 1;
  WorkerInputFile input_manifest = 2;
  string output_directory = 3;
  uint64 max_pixels = 4;
  oneof region {
    ColorRectangle rectangle = 5;
    ColorPolygon polygon = 6;
  }
  ColorOperation operation = 7;
}

message ColorPreviewRequest {
  TaskContext context = 1;
  ArtifactRef input_manifest_ref = 2;
  ColorPreviewInput parameters = 3;
}

message VideoProbeInput {
  WorkerInputFile source_video = 1;
  WorkerInputFile input_manifest = 2;
  string output_directory = 3;
  optional uint32 stream_index = 4;
  uint64 max_pixels = 5;
  uint32 max_frames = 6;
  uint32 timeout_ms = 7;
}

message VideoProbeRequest {
  TaskContext context = 1;
  ArtifactRef input_manifest_ref = 2;
  VideoProbeInput parameters = 3;
}

message FrameResolveInput {
  WorkerInputFile source_video = 1;
  WorkerInputFile input_manifest = 2;
  string output_directory = 3;
  uint32 stream_index = 4;
  optional uint64 frame_index = 5;
  optional sint64 expected_raw_pts = 6;
  uint32 display_width = 7;
  uint32 display_height = 8;
  uint64 max_pixels = 9;
  uint32 max_frames = 10;
  uint32 timeout_ms = 11;
}

message FrameResolveRequest {
  TaskContext context = 1;
  ArtifactRef input_manifest_ref = 2;
  FrameResolveInput parameters = 3;
}

message ExecutionLookup {
  string task_id = 1;
  string attempt_id = 2;
}

message ExecutionSnapshot {
  ExecutionHandle handle = 1;
  string status = 2;
  ArtifactRef result_manifest_ref = 3;
  string error_code = 4;
}

service PythonWorker {
  rpc StartAnnotationGeometryAudit(GeometryAuditRequest) returns (ExecutionHandle);
  rpc StartColorPreview(ColorPreviewRequest) returns (ExecutionHandle);
  rpc StartVideoProbe(VideoProbeRequest) returns (ExecutionHandle);
  rpc StartFrameResolve(FrameResolveRequest) returns (ExecutionHandle);
  rpc GetExecution(ExecutionLookup) returns (ExecutionSnapshot);
  rpc Health(HealthRequest) returns (HealthSnapshot);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReceipt);
}
